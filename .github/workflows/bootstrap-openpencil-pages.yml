name: Bootstrap OpenPencil and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout O_PEN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Clone upstream OpenPencil
        run: git clone --depth 1 https://github.com/open-pencil/open-pencil.git /tmp/open-pencil

      - name: Sync upstream source into O_PEN
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/open-pencil/ ./
          mkdir -p .github/workflows

      - name: Preserve bootstrap workflow and record upstream
        shell: bash
        run: |
          cat > .openpencil-upstream <<'EOF'
          source=https://github.com/open-pencil/open-pencil
          branch=master
          EOF
          echo "commit=$(git -C /tmp/open-pencil rev-parse HEAD)" >> .openpencil-upstream

      - name: Commit imported source
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import OpenPencil upstream"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build web app for project Pages
        run: bunx vite build --base=/O_PEN/

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
