name: Sync OpenPencil upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout O_PEN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Clone upstream OpenPencil
        run: git clone --depth 1 https://github.com/open-pencil/open-pencil.git /tmp/open-pencil

      - name: Sync upstream source into O_PEN
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='tests/fixtures/' \
            /tmp/open-pencil/ ./
          mkdir -p .github/workflows

      - name: Detach playground from upstream Git LFS
        shell: bash
        run: |
          rm -f .lfsconfig
          cat > .gitattributes <<'EOF'
          # O_PEN playground mirror: external OpenPencil Git LFS is intentionally disabled.
          # Heavy test fixtures are excluded during sync; runtime package assets remain available via dependencies.
          EOF
          git lfs uninstall --local || true
          if find . -path './.git' -prune -o -type f -size +99M -print -quit | grep -q .; then
            echo 'A file exceeds GitHub normal Git file limits.' >&2
            exit 1
          fi

      - name: Record upstream revision
        shell: bash
        run: |
          cat > .openpencil-upstream <<'EOF'
          source=https://github.com/open-pencil/open-pencil
          branch=master
          mirror_mode=playground-no-external-lfs
          excluded=tests/fixtures/
          EOF
          echo "commit=$(git -C /tmp/open-pencil rev-parse HEAD)" >> .openpencil-upstream

      - name: Commit synced source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync OpenPencil upstream playground"
            git push origin HEAD:main
          fi
