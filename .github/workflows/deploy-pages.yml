name: Deploy O_PEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build:packages

      - name: Build web app for GitHub Pages
        run: bunx vite build --base=/O_PEN/

      - name: Verify deployable output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/canvaskit.wasm
          grep -q '/O_PEN/' dist/index.html
          echo "dist/index.html and CanvasKit runtime asset verified"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$PAGE_URL" -o /tmp/o_pen_index.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Live Pages endpoint did not become reachable" >&2
              exit 1
            fi
            sleep 5
          done
          grep -q '<div id="app">' /tmp/o_pen_index.html
          grep -q '/O_PEN/' /tmp/o_pen_index.html
          curl --fail --silent --show-error --location "${PAGE_URL}canvaskit.wasm" -o /tmp/canvaskit.wasm
          test -s /tmp/canvaskit.wasm
          curl --fail --silent --show-error --location "${PAGE_URL}sw.js" -o /tmp/sw.js
          test -s /tmp/sw.js
          echo "Live HTML, service worker, and CanvasKit WASM verified at $PAGE_URL"

      - name: Print deployed URL
        run: echo "${{ steps.deployment.outputs.page_url }}"

      - name: Record deployment receipt
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > .pages-deployment.json <<EOF
          {
            "status": "$JOB_STATUS",
            "page_url": "$PAGE_URL",
            "source_sha": "$SOURCE_SHA",
            "updated_at": "$NOW"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-deployment.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Pages deployment [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
